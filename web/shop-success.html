<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment Complete — SuDa Mate</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .success-main {
      max-width: 480px; margin: 0 auto; padding: 96px 24px;
      text-align: center;
    }
    .success-icon { font-size: 56px; margin-bottom: 16px; }
    .success-main h1 { font-size: 24px; font-weight: 900; color: var(--navy); margin-bottom: 12px; }
    .success-main p { color: var(--muted); font-size: 15px; margin-bottom: 28px; }
    .success-main a.back-btn {
      display: inline-block; background: var(--accent); color: #fff; font-weight: 700;
      border-radius: 999px; padding: 12px 26px; font-size: 14px;
    }
  </style>
</head>
<body>
  <header class="bar">
    <a class="logo" href="/">
      <img src="/assets/logo.svg" alt="" class="logo-mark" width="28" height="28" />
      수다메이트
    </a>
    <div class="nav-right">
      <div class="lang-switcher" data-lang-switcher aria-label="Language"></div>
    </div>
  </header>

  <main class="success-main">
    <div class="success-icon">🎉</div>
    <h1 data-i18n="shopSuccess.title">Payment complete!</h1>
    <p data-i18n="shopSuccess.body">Your credits will be added shortly. Head back to the app to check.</p>
    <a class="back-btn" href="sudamate://shop" data-i18n="shopSuccess.backBtn">Back to the app</a>
  </main>

  <footer class="foot">
    <p data-i18n="footer.rights">© 2026 수다리스트. All rights reserved.</p>
  </footer>

  <script src="/i18n.js"></script>
</body>
</html>
