<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Face Verification Review — SooDaMate</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/assets/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .verify-main { max-width: 960px; margin: 0 auto; padding: 48px 24px 96px; }
    .verify-main h1 { font-size: 24px; font-weight: 900; color: var(--navy); margin-bottom: 24px; }

    #loginBox { max-width: 360px; margin: 80px auto; }
    #loginBox input {
      width: 100%; box-sizing: border-box; padding: 12px 14px; margin-bottom: 10px;
      border: 1px solid var(--border); border-radius: 10px; font-size: 15px;
    }
    #loginBox button {
      width: 100%; background: var(--navy); color: #fff; font-weight: 700; font-size: 15px;
      border: none; border-radius: 10px; padding: 12px; cursor: pointer;
    }
    #loginError { color: #B3261E; font-size: 13px; margin-top: 8px; display: none; }

    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn {
      border: 1px solid var(--border); background: var(--white); border-radius: 999px;
      padding: 8px 18px; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer;
    }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .card {
      background: var(--white); border: 1px solid var(--border); border-radius: 16px;
      overflow: hidden; display: flex; flex-direction: column;
    }
    .card .photos { display: grid; grid-template-columns: 1fr 1fr; }
    .card .photos figure { margin: 0; position: relative; }
    .card .photos img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--cream-deep); display: block; }
    .card .photos figcaption {
      position: absolute; bottom: 0; left: 0; right: 0; text-align: center;
      font-size: 10px; font-weight: 700; color: #fff; background: rgba(11,41,68,0.65); padding: 3px 0;
    }
    .card .body { padding: 12px 14px; }
    .card .name { font-weight: 800; color: var(--navy); font-size: 14px; margin-bottom: 2px; }
    .card .date { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
    .card .actions { display: flex; gap: 8px; }
    .card button {
      flex: 1; border: none; border-radius: 8px; padding: 8px; font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .approve-btn { background: var(--sage, #7FA37A); color: #fff; }
    .reject-btn { background: #D92D20; color: #fff; }
    .cancel-btn { background: var(--cream-deep); color: var(--muted); }
    .reject-reason { font-size: 12px; color: var(--muted); margin-top: 6px; font-style: italic; }
    .reject-form { display: flex; flex-direction: column; gap: 6px; }
    .reject-form select, .reject-form textarea {
      width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 13px;
      border: 1px solid var(--border); border-radius: 8px; font-family: inherit;
    }
    .reject-form textarea { resize: vertical; min-height: 50px; }
    .reject-form .row { display: flex; gap: 8px; }
    .status-pill {
      display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px;
      padding: 3px 10px; margin-bottom: 10px;
    }
    .status-approved { background: #E6F4EA; color: #1E7A34; }
    .status-rejected { background: #FBEAE9; color: #B3261E; }
    .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  </style>
</head>
<body>
  <div id="loginBox">
    <h1 style="font-size:20px;font-weight:900;color:var(--navy);margin-bottom:16px;">Admin sign in</h1>
    <input id="loginEmail" type="email" placeholder="Email" autocomplete="username" />
    <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="loginBtn">Sign in</button>
    <p id="loginError">Sign-in failed or this account isn't an admin.</p>
  </div>

  <main class="verify-main" id="mainView" style="display:none">
    <h1>Face verification review</h1>
    <div class="tabs">
      <button class="tab-btn active" data-status="pending">Pending</button>
      <button class="tab-btn" data-status="approved">Approved</button>
      <button class="tab-btn" data-status="rejected">Rejected</button>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="emptyMsg" style="display:none">Nothing here.</p>
  </main>

  <script>
    const API_BASE_URL =
      window.SUDA_API_BASE_URL ||
      (location.hostname === "localhost" || location.hostname === "127.0.0.1"
        ? "http://localhost:8001"
        : "https://soodamate-production.up.railway.app");

    let token = sessionStorage.getItem("sooda_admin_token");
    let currentStatus = "pending";

    // Keys must match backend REJECTION_REASON_KEYS (app/schemas/verification.py)
    // and the mobile app's faceVerification.rejectReasons.* translations -
    // the user sees the *translated* label in their own app language, not
    // this English one, except for "other" which is shown verbatim.
    const REJECT_REASONS = [
      { key: "selfie_id_mismatch", label: "Selfie doesn't clearly match the ID photo" },
      { key: "id_blurry", label: "ID photo is blurry or unreadable" },
      { key: "selfie_blurry", label: "Selfie is blurry, too dark, or someone else is in it" },
      { key: "name_mismatch", label: "Name on ID doesn't match the profile name" },
      { key: "id_invalid", label: "ID appears edited, expired, or invalid" },
      { key: "incomplete", label: "Submission is incomplete (missing selfie or ID)" },
      { key: "other", label: "Other (write a custom reason)" },
    ];

    const loginBox = document.getElementById("loginBox");
    const mainView = document.getElementById("mainView");
    const loginError = document.getElementById("loginError");
    const grid = document.getElementById("grid");
    const emptyMsg = document.getElementById("emptyMsg");

    function showMain() {
      loginBox.style.display = "none";
      mainView.style.display = "block";
      loadList();
    }

    if (token) showMain();

    document.getElementById("loginBtn").addEventListener("click", async () => {
      loginError.style.display = "none";
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      try {
        const resp = await fetch(`${API_BASE_URL}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        if (!resp.ok) throw new Error("login failed");
        const data = await resp.json();
        // Confirm admin access up front rather than only discovering it's
        // missing once the list call itself 403s.
        const check = await fetch(`${API_BASE_URL}/admin/face-verifications?status=pending`, {
          headers: { Authorization: `Bearer ${data.access_token}` },
        });
        if (!check.ok) throw new Error("not an admin");
        token = data.access_token;
        sessionStorage.setItem("sooda_admin_token", token);
        showMain();
      } catch (e) {
        loginError.style.display = "block";
      }
    });

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentStatus = btn.getAttribute("data-status");
        loadList();
      });
    });

    async function loadList() {
      grid.innerHTML = "";
      emptyMsg.style.display = "none";
      const resp = await fetch(`${API_BASE_URL}/admin/face-verifications?status=${currentStatus}`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!resp.ok) {
        sessionStorage.removeItem("sooda_admin_token");
        location.reload();
        return;
      }
      const items = await resp.json();
      if (items.length === 0) {
        emptyMsg.style.display = "block";
        return;
      }
      grid.innerHTML = items
        .map(
          (item) => `
        <div class="card" data-id="${item.id}">
          <div class="photos">
            <figure><img src="${item.selfie_view_url}" alt="" /><figcaption>Selfie</figcaption></figure>
            <figure><img src="${item.id_photo_view_url || ''}" alt="" /><figcaption>ID</figcaption></figure>
          </div>
          <div class="body">
            <div class="name">${escapeHtml(item.display_name || "(no name)")}</div>
            <div class="date">${new Date(item.submitted_at).toLocaleString()}</div>
            ${
              item.status === "pending"
                ? `<div class="actions-wrap">
                     <div class="actions">
                       <button class="approve-btn" data-action="approve">Approve</button>
                       <button class="reject-btn" data-action="reject-open">Reject</button>
                     </div>
                   </div>`
                : `<span class="status-pill status-${item.status}">${item.status}</span>
                   ${
                     item.status === "rejected" && item.rejection_reason
                       ? `<div class="reject-reason">"${escapeHtml(item.rejection_reason)}"</div>`
                       : ""
                   }`
            }
          </div>
        </div>`
        )
        .join("");

      grid.querySelectorAll("button[data-action='approve']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.closest(".card").getAttribute("data-id");
          btn.disabled = true;
          await fetch(`${API_BASE_URL}/admin/face-verifications/${id}/approve`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` },
          });
          loadList();
        });
      });

      grid.querySelectorAll("button[data-action='reject-open']").forEach((btn) => {
        btn.addEventListener("click", () => openRejectForm(btn.closest(".actions-wrap")));
      });
    }

    function openRejectForm(wrap) {
      const options = REJECT_REASONS.map((r) => `<option value="${r.key}">${escapeHtml(r.label)}</option>`).join("");
      wrap.innerHTML = `
        <div class="reject-form">
          <select class="reason-select">${options}</select>
          <textarea class="reason-text" placeholder="Custom reason the user will see..." style="display:none"></textarea>
          <div class="row">
            <button class="reject-btn" data-action="reject-confirm">Confirm reject</button>
            <button class="cancel-btn" data-action="reject-cancel">Cancel</button>
          </div>
        </div>`;

      const select = wrap.querySelector(".reason-select");
      const textarea = wrap.querySelector(".reason-text");
      select.addEventListener("change", () => {
        textarea.style.display = select.value === "other" ? "block" : "none";
      });

      wrap.querySelector("[data-action='reject-cancel']").addEventListener("click", () => loadList());

      wrap.querySelector("[data-action='reject-confirm']").addEventListener("click", async (e) => {
        const reasonKey = select.value;
        const reasonInfo = REJECT_REASONS.find((r) => r.key === reasonKey);
        const customText = textarea.value.trim();
        if (reasonKey === "other" && !customText) {
          textarea.style.display = "block";
          textarea.focus();
          return;
        }
        const reason = reasonKey === "other" ? customText : reasonInfo.label;

        const id = wrap.closest(".card").getAttribute("data-id");
        e.target.disabled = true;
        await fetch(`${API_BASE_URL}/admin/face-verifications/${id}/reject`, {
          method: "POST",
          headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
          body: JSON.stringify({ reason_key: reasonKey, reason }),
        });
        loadList();
      });
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
